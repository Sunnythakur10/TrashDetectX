<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TrashDetectX</title>

    <!-- Firebase SDKs -->
    <script defer src="/__/firebase/11.3.1/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/11.3.1/firebase-auth-compat.js"></script>
    <script defer src="/__/firebase/11.3.1/firebase-database-compat.js"></script>
    <script defer src="/__/firebase/11.3.1/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/11.3.1/firebase-functions-compat.js"></script>
    <script defer src="/__/firebase/11.3.1/firebase-messaging-compat.js"></script>
    <script defer src="/__/firebase/11.3.1/firebase-storage-compat.js"></script>
    <script defer src="/__/firebase/11.3.1/firebase-analytics-compat.js"></script>
    <script defer src="/__/firebase/11.3.1/firebase-remote-config-compat.js"></script>
    <script defer src="/__/firebase/11.3.1/firebase-performance-compat.js"></script>
    <script defer src="/__/firebase/init.js?useEmulator=true"></script>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
      /* Global styles */
      :root {
        --primary-color: #1E88E5;
        --secondary-color: #43A047;
        --text-color: #212121;
        --background-color: #F5F7FA;
        --card-background: #FFFFFF;
        --shadow-color: rgba(0, 0, 0, 0.08);
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Dark mode variables */
      .dark-mode {
        --primary-color: #42A5F5;
        --secondary-color: #66BB6A;
        --text-color: #E0E0E0;
        --background-color: #1A1A1A;
        --card-background: #252525;
        --shadow-color: rgba(0, 0, 0, 0.4);
      }

      body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: var(--background-color);
        color: var(--text-color);
        transition: var(--transition);
      }

      /* Navbar styles */
      .navbar {
        background-color: var(--primary-color);
        padding: 1rem 2rem;
        box-shadow: 0 4px 12px var(--shadow-color);
        transition: var(--transition);
      }

      .navbar-brand {
        display: flex;
        align-items: center;
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #FFFFFF !important;
        position: relative;
        transition: var(--transition);
      }

      .navbar-brand:hover {
        transform: translateY(-2px);
      }

      .navbar-brand::after {
        content: '';
        position: absolute;
        bottom: -4px;
        left: 0;
        width: 0;
        height: 2px;
        background-color: #FFFFFF;
        transition: width 0.3s ease;
      }

      .navbar-brand:hover::after {
        width: 100%;
      }

      /* Logo styles */
      .navbar-logo {
        width: 40px;
        height: 40px;
        margin-right: 0.75rem;
        transition: var(--transition);
      }

      .navbar-brand:hover .navbar-logo {
        transform: scale(1.1);
      }

      /* Container styles */
      .container {
        max-width: 1200px;
        margin: 2rem auto;
        padding: 0 1.5rem;
      }

      /* Card styles */
      .card {
        background-color: var(--card-background);
        border: none;
        border-radius: 12px;
        box-shadow: 0 6px 24px var(--shadow-color);
        transition: var(--transition);
        overflow: hidden;
      }

      .card:hover {
        transform: translateY(-8px);
        box-shadow: 0 12px 32px var(--shadow-color);
      }

      .card .text-center {
        padding: 2.5rem;
      }

      /* Typography */
      h3 {
        font-size: 1.75rem;
        font-weight: 600;
        color: var(--text-color);
        position: relative;
        margin-bottom: 1.5rem;
      }

      h3::after {
        content: '';
        position: absolute;
        bottom: -8px;
        left: 50%;
        transform: translateX(-50%);
        width: 60px;
        height: 3px;
        background-color: var(--primary-color);
        transition: var(--transition);
      }

      .card:hover h3::after {
        width: 100px;
      }

      p {
        font-size: 1.1rem;
        color: var(--text-color);
        margin-bottom: 2rem;
      }

      /* Button styles */
      .btn {
        border-radius: 8px;
        padding: 0.75rem 1.5rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        transition: var(--transition);
        position: relative;
        overflow: hidden;
      }

      .btn-success {
        background-color: var(--secondary-color);
        border-color: var(--secondary-color);
      }

      .btn:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 16px var(--shadow-color);
      }

      .btn:active {
        transform: translateY(-1px);
      }

      /* Ripple effect */
      .btn::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 300px;
        height: 300px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        transform: translate(-50%, -50%) scale(0);
        transition: transform 0.5s ease;
      }

      .btn:active::after {
        transform: translate(-50%, -50%) scale(1);
        transition: transform 0.3s ease;
      }

      /* Dark mode toggle button */
      .dark-toggle-btn {
        background: transparent;
        border: none;
        color: #FFFFFF;
        font-size: 1.5rem;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: var(--transition);
      }

      .dark-toggle-btn:hover {
        background-color: rgba(255, 255, 255, 0.1);
        transform: scale(1.1);
      }

      .dark-toggle-btn:focus {
        outline: none;
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.2);
      }

      /* User photo styles */
      #userPhoto {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: 4px solid var(--card-background);
        box-shadow: 0 4px 12px var(--shadow-color);
        transition: var(--transition);
        margin-bottom: 1.5rem;
      }

      #userPhoto:hover {
        transform: scale(1.05);
        box-shadow: 0 8px 20px var(--shadow-color);
      }

      /* Pulse animation for report button */
      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(67, 160, 71, 0.4); }
        70% { box-shadow: 0 0 0 16px rgba(67, 160, 71, 0); }
        100% { box-shadow: 0 0 0 0 rgba(67, 160, 71, 0); }
      }

      .btn-success:hover {
        animation: pulse 1.5s infinite;
      }

      /* Responsive adjustments */
      @media (max-width: 768px) {
        .navbar {
          padding: 0.75rem 1rem;
        }

        .container {
          margin: 1.5rem auto;
          padding: 0 1rem;
        }

        .card .text-center {
          padding: 1.5rem;
        }

        h3 {
          font-size: 1.5rem;
        }

        .btn {
          padding: 0.5rem 1rem;
        }

        #userPhoto {
          width: 80px;
          height: 80px;
        }

        .navbar-logo {
          width: 32px;
          height: 32px;
          margin-right: 0.5rem;
        }
      }
    </style>
  </head>
  <body class="light-mode">
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="#">
                <img src="/static/logo.svg" alt="TrashDetectX Logo" class="navbar-logo">
                TrashDetectX
            </a>
            <div>
                <button class="dark-toggle-btn" onclick="toggleDarkMode()" aria-label="Toggle Dark Mode">🌙</button>
                <button class="btn btn-danger" onclick="window.location.href='/logout'">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Dashboard Card -->
    <div class="container mt-5">
        <div class="card shadow p-4">
            <div class="text-center">
                
                <h3>Welcome!</h3>
                <p><strong>Email: harshsonar271@gmail.com</strong> <span id="userEmail"></span></p>
                <a href="/report" class="btn btn-success btn-lg">Report Trash</a>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="{{ url_for('static', filename='js/firebase-config.js') }}"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

    <!-- Dark Mode Toggle Script -->
    <script>
        function toggleDarkMode() {
            const body = document.body;
            const darkToggleBtn = document.querySelector('.dark-toggle-btn');
            
            body.classList.toggle("dark-mode");
            body.classList.toggle("light-mode");
            
            darkToggleBtn.textContent = body.classList.contains("dark-mode") ? "☀️" : "🌙";
            darkToggleBtn.style.transform = "rotate(360deg)";
            setTimeout(() => {
                darkToggleBtn.style.transform = "rotate(0)";
            }, 300);
        }

        document.addEventListener('DOMContentLoaded', function() {
            const reportBtn = document.querySelector('.btn-success');
            
            reportBtn.addEventListener('mouseenter', function() {
                this.style.transform = 'translateY(-5px) scale(1.05)';
            });
            
            reportBtn.addEventListener('mouseleave', function() {
                this.style.transform = 'translateY(0) scale(1)';
            });
        });
    </script>
</body>
</html>
